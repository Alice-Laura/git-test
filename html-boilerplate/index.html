<!-- The DOCTYPE 
 Every HTML page starts witha doctype declaration. The doctypes's
 purpose is to tell the browser what version of HTML it should use
 to render the document. The latest vesrion of HTML is HTML5 and
 the doctype for that vesrion is <!DOCTYPE html> -->

<!DOCTYPE html>
<html lang = "en" >
<!--
 Head Element 
 The <head> element is where we put important meta-information
about our webpages, and stuff required for our webpages to render 
correctly in the browser. Inside the <head>, we should not use 
any element that displays content on the webpage
-->
<head>
	<meta charset = "UTF-8">
	<!-- Setting the encoding is very important because it
	ensures that the webpage will display special symbols
	and characters from different languages correctly in the
	browser. -->
	<title>MY first Webpage</title>
	<!-- The <title> element is used to give webpages a human
	readable-title, which is diplayed in our webpages'-browser
	tab.If the <title> element isn't included, the webpage's 
	title will default to its filename-in our case, index.html
	which isn't very meaningful for users. -->
</head>
<!-- The Body Element
 The final element to include in the HTML boilerplate is the <body>
 element. This is where all the contents that will be displayed to users
 will go - the text, links , images and so on. -->
<body>

</body>
</html>
